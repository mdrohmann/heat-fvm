[project]
name = "heat-fvm-solver"
version = "0.1.0"
description = "2D FVM heat-flow solver and model-order reduction for the heat-fvm demo"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Only for scripts/rb_findings_walkthrough.py's plots -- the app and tests never
# import matplotlib, so this is deliberately its own extra rather than folded into dev.
explore = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solver*"]

[tool.pytest.ini_options]
testpaths = ["solver/tests", "api/tests"]
pythonpath = ["."]
